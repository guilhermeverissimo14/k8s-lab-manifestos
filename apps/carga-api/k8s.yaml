apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-api
spec:
  selector:
    matchLabels: { app: carga-api }
  template:
    metadata:
      labels: { app: carga-api }
    spec:
      containers:
        - name: carga-api
          image: carga-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health/readiness, port: 8080 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health/liveness, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: carga-api
  labels: { app: carga-api }
spec:
  type: NodePort
  selector: { app: carga-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carga-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carga-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70