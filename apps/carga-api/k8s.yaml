apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-api
spec:
  selector:
    matchLabels: { app: carga-api }
  template:
    metadata:
      labels: { app: carga-api }
    spec:
      containers:
        - name: carga-api
          image: carga-api:1.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic
                  key: license
            - name: NEW_RELIC_APP_NAME
              value: carga-api
            - name: NEW_RELIC_LOG_FILE_NAME
              value: STDOUT
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "false"
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 640Mi }
          readinessProbe:
            httpGet: { path: /health/readiness, port: 8080 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health/liveness, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: carga-api
  labels: { app: carga-api }
spec:
  type: NodePort
  selector: { app: carga-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carga-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carga-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: carga-api
spec:
  selector:
    matchLabels:
      app: carga-api
  endpoints:
    - port: http
      path: /prometheus
      interval: 15s          